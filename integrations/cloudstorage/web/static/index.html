<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Storage</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a73e8'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>
  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span>Cloud Storage</span>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="btn icon-btn" title="Tema gelap/terang" aria-label="Ubah tema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
      <button id="newFolderBtn" class="btn secondary" title="Buat folder baru">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <path d="M12 11v6M9 14h6"/>
        </svg>
        <span>New Folder</span>
      </button>
      <button id="uploadFolderBtn" class="btn secondary" title="Upload folder lengkap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <path d="M12 10v6M9 13l3-3 3 3"/>
        </svg>
        <span>Upload Folder</span>
      </button>
      <button id="uploadBtn" class="btn primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>
          <path d="M12 12v9M8 15l4-4 4 4"/>
        </svg>
        <span>Upload File</span>
      </button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <nav>
        <ul>
          <li class="active" data-view="root">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>My Drive</span>
          </li>
          <li data-view="trash">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/>
            </svg>
            <span>Trash</span>
          </li>
        </ul>
      </nav>
    </aside>

    <section class="content">
      <div class="breadcrumb" id="breadcrumb">My Drive</div>

      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Cari di Drive..." />
        </div>
        <div class="trash-actions">
          <button id="restoreAllBtn" class="btn secondary hidden" title="Pulihkan semua dari trash">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            <span>Pulihkan Semua</span>
          </button>
          <button id="emptyTrashBtn" class="btn danger hidden" title="Kosongkan trash (hapus permanen semua)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/>
            </svg>
            <span>Kosongkan Trash</span>
          </button>
        </div>
        <div class="view-options">
          <button id="listViewBtn" class="active" title="List view" aria-label="List view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
            </svg>
          </button>
          <button id="gridViewBtn" title="Grid view" aria-label="Grid view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="fileList" class="file-list list-view"></div>

      <div id="loadMoreWrap" class="load-more-wrap hidden">
        <button id="loadMoreBtn" class="btn secondary">Muat lebih banyak</button>
      </div>

      <div id="loading" class="loading hidden">Memuat...</div>

      <div id="uploadProgress" class="upload-progress hidden">
        <div class="upload-progress-card">
          <div class="upload-progress-header">
            <span class="upload-progress-title" id="uploadProgressTitle">Mengupload</span>
            <div class="upload-progress-header-right">
              <span class="upload-progress-percent" id="uploadProgressPercent">0%</span>
              <button id="uploadCancelBtn" class="upload-progress-cancel" title="Batalkan">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="upload-progress-agg">
            <div class="upload-progress-bar">
              <div class="upload-progress-fill" id="uploadProgressBar"></div>
            </div>
            <div class="upload-progress-meta">
              <span id="uploadProgressFiles">0 file</span>
              <span id="uploadProgressBytes">0 / 0</span>
              <span id="uploadProgressSpeed"></span>
            </div>
          </div>
          <div class="upload-progress-list" id="uploadProgressList"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="dropOverlay" class="drop-overlay hidden">
    <div class="drop-overlay-card">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>
        <path d="M12 12v9M8 15l4-4 4 4"/>
      </svg>
      <p>Lepaskan untuk upload ke folder ini</p>
    </div>
  </div>

  <div id="selectionBar" class="hidden">
    <span class="count" id="selectionCount">0 dipilih</span>
    <div class="selection-actions">
      <button id="restoreSelBtn" class="hidden" title="Pulihkan (Recovery)" aria-label="Pulihkan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
      <button id="deleteBtn" class="danger" title="Hapus (Delete)" aria-label="Hapus">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/>
        </svg>
      </button>
      <button id="copyBtn" title="Copy (Ctrl+C)" aria-label="Salin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <button id="cutBtn" title="Cut (Ctrl+X)" aria-label="Potong">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/>
          <circle cx="6" cy="18" r="3"/>
          <path d="M8.12 8.12L20 20M14.14 14.14L20 20M8.12 15.88L12 12"/>
        </svg>
      </button>
    </div>
    <button id="clearSelectionBtn" class="clear-btn" aria-label="Bersihkan seleksi">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div id="contextMenu" class="context-menu hidden">
    <ul>
      <li data-action="open" data-folder>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        Buka
      </li>
      <li data-action="rename">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
        Ganti Nama
      </li>
      <li data-action="delete" class="danger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/>
        </svg>
        Hapus
      </li>
      <li data-action="share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        Bagikan
      </li>
      <li data-action="copy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Salin
      </li>
      <li data-action="paste">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        </svg>
        Tempel
      </li>
      <li data-action="move">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <path d="M12 11v6M9 14l3 3 3-3"/>
        </svg>
        Pindahkan
      </li>
      <li data-action="download">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Download
      </li>
    </ul>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="close" title="Tutup (Esc)">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

   <div id="toast" class="toast hidden"></div>

   <div id="customDialog" class="custom-dialog hidden">
     <div class="custom-dialog-card">
       <div class="custom-dialog-accent"></div>
       <div class="custom-dialog-header">
         <div class="custom-dialog-icon" id="customDialogIcon"></div>
         <h3 class="custom-dialog-title" id="customDialogTitle"></h3>
       </div>
       <div class="custom-dialog-body" id="customDialogBody"></div>
       <input type="text" id="customDialogInput" class="custom-dialog-input" />
       <div class="custom-dialog-buttons">
         <button id="customDialogCancel" class="custom-dialog-btn secondary">Batal</button>
         <button id="customDialogSubmit" class="custom-dialog-btn primary">OK</button>
       </div>
     </div>
   </div>

   <script src="/js/modal_helpers.js?v=2"></script>
   <script src="/js/app.js?v=2"></script>
</body>
</html>
