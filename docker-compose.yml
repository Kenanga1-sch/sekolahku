services:
  sekolahku:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sekolahku-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      PORT: 8181
      TZ: Asia/Jakarta
      ENV: production
      # WAJIB diisi di .env di server — tanpa ini backend menolak start.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      # Produksi lewat HTTPS (Cloudflare Tunnel) → cookie Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Asal request yang diizinkan (CORS + CSRF).
      EXTRA_ALLOWED_ORIGINS: ${EXTRA_ALLOWED_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-http://telegram-bot-api:8081}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./uploads:/app/uploads
      - ./dist:/app/dist
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: sekolahku-telegram-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
